<!DOCTYPE html>
<html lang="{{ page.lang | default: 'de' | escape }}">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.data.blog.title | escape }} | {{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.data.blog.intro | escape }}">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/blog.css' | relative_url }}">
  </head>
  <body>
    {% include header.html %}
    <main class="main-section">
      <div class="container"><div class="content-wrapper">
        {% if site.blog_public or site.blog_preview %}
          {{ content }}
        {% else %}
          <div id="blogGate" data-password="{{ site.data.blog-access.password | escape }}">{% include blog-coming-soon.html %}</div>
          <div id="blogUnlocked" hidden>{{ content }}</div>
        {% endif %}
      </div></div>
    </main>
    {% include footer.html %}
    {% include translations.html %}
  </body>
</html>
