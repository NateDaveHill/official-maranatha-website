<!DOCTYPE html>
<html lang="{{ page.lang | default: 'de' | escape }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.data.blog.title | escape }} | {{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.data.blog.intro | escape }}">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/blog.css' | relative_url }}">
  </head>
  <body>
    <header class="header-section">
      <div class="container">
        <a href="{{ '/' | relative_url }}" class="blog-home-link">
          <img class="blog-logo" src="https://images.squarespace-cdn.com/content/v1/662679d937b7bc3b18b12ea0/0070714c-2951-4996-b751-655b1adad48d/Maranatha+Logo+1.png?format=500w" alt="Maranatha Gemeinde">
        </a>
        <nav class="navigation-bar" aria-label="Hauptnavigation">
          <a href="{{ '/' | relative_url }}" class="nav-link">Home</a>
          <a href="{{ '/about.html' | relative_url }}" class="nav-link">About</a>
          <a href="{{ '/blog/' | relative_url }}" class="nav-link active"{% if page.url == '/blog/' %} aria-current="page"{% endif %}>Blog</a>
        </nav>
      </div>
    </header>
    <main class="main-section">
      <div class="container blog-container">{{ content }}</div>
    </main>
    {% include footer.html %}
  </body>
</html>
