title: Maranatha Gemeinde
url: "https://maranatha-gemeinde.com"
baseurl: ""
timezone: Europe/Berlin
markdown: kramdown
permalink: /blog/:year/:month/:day/:title/
future: false
unpublished: false
strict_front_matter: true
blog_public: false
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      lang: de
exclude:
  - Gemfile
  - Gemfile.lock
  - BLOG_SETUP.md
  - vendor
  - _config.preview.yml
